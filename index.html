<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasolineras España</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --azul:#1565C0; --verde:#2E7D32; --borde:#ddd; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Arial, sans-serif; display:flex; height:100vh; }
  #panel { width:330px; min-width:280px; padding:14px; overflow-y:auto; border-right:1px solid var(--borde); background:#fafafa; }
  h1 { font-size:1.15rem; margin:0 0 10px; color:var(--azul); }
  fieldset { border:1px solid var(--borde); border-radius:8px; margin:0 0 12px; padding:8px 10px; background:#fff; }
  legend { font-size:.85rem; font-weight:600; color:#555; padding:0 4px; }
  label { display:block; font-size:.85rem; margin:6px 0 2px; }
  select, input[type=text] { width:100%; padding:6px; border:1px solid var(--borde); border-radius:6px; font-size:.9rem; }
  input[type=range] { width:100%; }
  .fila { display:flex; gap:8px; align-items:center; margin-top:6px; }
  button { cursor:pointer; border:none; border-radius:6px; padding:8px 10px; font-size:.9rem; background:var(--azul); color:#fff; width:100%; margin-top:6px; }
  button.sec { background:#fff; color:var(--azul); border:1px solid var(--azul); }
  button:hover { opacity:.9; }
  #marcas { max-height:150px; overflow-y:auto; border:1px solid var(--borde); border-radius:6px; padding:4px; background:#fff; }
  #marcas label { margin:2px 0; font-size:.85rem; display:flex; gap:6px; align-items:center; }
  #mapa { flex:1; }
  #estado { font-size:.8rem; color:#666; margin-top:8px; }
  .precio { font-weight:700; color:var(--verde); }
  .popup small { color:#666; }
  @media (max-width: 700px) {
    body { flex-direction:column; }
    #panel { width:100%; height:45%; border-right:none; border-bottom:1px solid var(--borde); }
    #mapa { height:55%; }
  }
  .marcador-usuario {
    background-color: #D32F2F;
    border: 3px solid #FFFFFF;
    border-radius: 50%;
    box-shadow: 0 0 0 5px rgba(211, 47, 47, 0.35), 0 2px 6px rgba(0, 0, 0, 0.45);
  }
  #listaBaratas { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .item-gasolinera {
    border: 1px solid var(--borde); border-radius: 6px; padding: 6px 8px;
    background: #fff; cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; gap: 8px; transition: background 0.15s, border-color 0.15s;
  }
  .item-gasolinera:hover { background: #f0f6ff; border-color: var(--azul); }
  .item-gasolinera .info { overflow: hidden; }
  .item-gasolinera .nombre { font-size: .82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-gasolinera .meta { font-size: .75rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-gasolinera .importe { font-size: .95rem; font-weight: 700; color: var(--verde); white-space: nowrap; }
  
  .icono-gasolinera {
    background: transparent;
    border: none;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
  }
</style>
</head>
<body>
<div id="panel">
  <h1>⛽ Gasolineras España</h1>

  <fieldset>
    <legend>Ubicación</legend>
    <div class="fila">
      <button id="btnGps" style="margin-top:0">Usar mi ubicación</button>
    </div>
    <label for="direccion">o dirección:</label>
    <input type="text" id="direccion" placeholder="Calle, número, ciudad…">
    <button class="sec" id="btnDir">Buscar dirección</button>
  </fieldset>

  <fieldset>
    <legend>Ruta</legend>
    <label for="destino">Destino:</label>
    <input type="text" id="destino" placeholder="Dirección de destino…">
    <button id="btnRuta">Calcular ruta</button>
	
	<label for="radio">Radio de desvío: <span id="radioVal">3</span> km</label>
    <input type="range" id="radio" min="1" max="10" step="0.5" value="3">

    <div class="fila">
      <input type="checkbox" id="soloRuta">
      <label for="soloRuta" style="margin:0">Solo gasolineras en la ruta (sin desvíos)</label>
    </div>
	
    <button class="sec" id="btnQuitarRuta">Quitar ruta</button>
  </fieldset>

  <fieldset>
    <legend>Preferencias</legend>
    <label for="carburante">Carburante:</label>
    <select id="carburante"></select>

    <label>Marcas:</label>
    <div id="marcas"><em style="font-size:.8rem">Esperando ubicación…</em></div>
  </fieldset>
  <fieldset>
	  <label for="antiguedad">Actualización del precio:</label>
		<select id="antiguedad">
		  <option value="TODAS">Todas las gasolineras</option>
		  <option value="0">Actualizadas hoy (0 días)</option>
		  <option value="1">Máximo 1 día sin actualizar</option>
		  <option value="2">Máximo 2 días sin actualizar</option>
		  <option value="3">Máximo 3 días sin actualizar</option>
		  <option value="MAS_3">Más de 3 días sin actualizar</option>
		</select>
  </fieldset>
  
  <fieldset>
    <legend>Más baratas (según filtro)</legend>
    <div id="listaBaratas">
      <em style="font-size:.8rem; color:#666">Sin datos para mostrar…</em>
    </div>
  
  </fieldset>

  <button class="sec" id="btnActualizar">Actualizar precios</button>
  <div id="estado"></div>
</div>
<div id="mapa"></div>

<script>
/* ============ Configuración ============ */
const FUELS = {
  GASOLEO_A:      { label:"Diésel",          campo:"Precio Gasoleo A" },
  GASOLEO_PREMIUM:{ label:"Diésel Premium",  campo:"Precio Gasoleo Premium" },
  GASOLINA_95:    { label:"Gasolina 95",     campo:"Precio Gasolina 95 E5" },
  GASOLINA_98:    { label:"Gasolina 98",     campo:"Precio Gasolina 98 E5" },
  GLP:            { label:"Autogás (GLP)",   campo:"Precio Gases licuados del petróleo" },
  GNC:            { label:"GNC",             campo:"Precio Gas natural comprimido" },
  GNL:            { label:"GNL",             campo:"Precio Gas natural licuado" }
};

const API_PROVINCIA = "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroProvincia/";
const OSRM = "https://router.project-osrm.org/route/v1/driving/";
const NOMINATIM_SEARCH = "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q=";
const NOMINATIM_REVERSE = "https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1";

/* Diccionario de respaldo de provincias españolas */
const PROVINCIAS_MAP = {
  "alava":"01","araba":"01","albacete":"02","alicante":"03","alacant":"03","almeria":"04",
  "avila":"05","badajoz":"06","balears":"07","baleares":"07","barcelona":"08","burgos":"09",
  "caceres":"10","cadiz":"11","castellon":"12","castello":"12","ciudad real":"13","cordoba":"14",
  "coruña":"15","a coruña":"15","la coruña":"15","cuenca":"16","girona":"17","gerona":"17",
  "granada":"18","guadalajara":"19","gipuzkoa":"20","guipuzcoa":"20","huelva":"21","huesca":"22",
  "jaen":"23","leon":"24","lleida":"25","lerida":"25","rioja":"26","lugo":"27","madrid":"28",
  "malaga":"29","murcia":"30","navarra":"31","nafarroa":"31","ourense":"32","orense":"32",
  "asturias":"33","palencia":"34","palmas":"35","las palmas":"35","pontevedra":"36","salamanca":"37",
  "santa cruz de tenerife":"38","tenerife":"38","cantabria":"39","segovia":"40","sevilla":"41",
  "soria":"42","tarragona":"43","teruel":"44","toledo":"45","valencia":"46","valencia/valencia":"46",
  "valladolid":"47","bizkaia":"48","vizcaya":"48","zamora":"49","zaragoza":"50","ceuta":"51","melilla":"52"
};

const MARCAS_CONOCIDAS = [
  "REPSOL", "MOEVE", "CEPSA", "CARBUGAL", "GALP", "BP", "SHELL",
  "PLENOIL", "PLENERGY", "BALLENOIL", "PETROPRIX", "PETROCASH", "SBC", "ORTIGAL",
  "STAROIL", "VALCARCE", "GALURESA", "EROSKI", "CARREFOUR", "ALCAMPO",
  "BONAREA", "BONÀREA", "AVIA", "Q8", "PETRONOR", "CAMPSA", "DISA",
  "MEROIL", "BEROIL", "AUTONETOIL", "EASYGAS", "GAS EXPRESS", "GASEXPRESS",
  "OILPRIX", "COSTCO", "MAKRO", "LECLERC", "HAFESA", "AGLA", "MAXOIL",
  "FARRUCO", "IDS", "AS24", "DYNEFF", "TAMOIL", "AN ENERGETICOS"
];

function normalizarMarca(rotulo = "") {
  let limpio = rotulo.toUpperCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  // 1. Buscar si contiene alguna marca comercial conocida
  for (const marca of MARCAS_CONOCIDAS) {
    const marcaNorm = marca.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const regex = new RegExp(`(^|[^A-Z0-9])${marcaNorm}([^A-Z0-9]|$)`);
    if (regex.test(limpio)) {
      return marca === "BONÀREA" ? "BONAREA" : marca;
    }
  }

  // 2. Si es otra estación, quitar prefijos genéricos ("E.S.", "ESTACION DE SERVICIO", etc.)
  limpio = limpio
    .replace(/^(E\.?\s*S\.?|ESTACION\s+DE\s+SERVICIO|GASOLINERA|AREA\s+DE\s+SERVICIO)\s+/i, "")
    .split(/\s+[-/,]\s+/)[0]
    .trim();

  return limpio || "SIN MARCA";
}

const iconoUsuario = L.divIcon({
  className: "marcador-usuario",
  iconSize: [18, 18],
  iconAnchor: [9, 9],
  popupAnchor: [0, -10]
});

/* ============ Estado ============ */
let estaciones = [];          // Estaciones cargadas en memoria
let provinciasCargadas = new Set();
let userPos = null;           // [lat, lon]
let ruta = null;              // [[lat, lon], ...]
let capaEstaciones = null, capaRuta = null, marcadorUsuario = null;
let prefs = JSON.parse(localStorage.getItem("gasolineras_prefs") || "{}");

/* ============ Mapa ============ */
const mapa = L.map("mapa").setView([40.4168, -3.7038], 6);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> · Precios: MITECO"
}).addTo(mapa);
capaEstaciones = L.layerGroup().addTo(mapa);
capaRuta = L.layerGroup().addTo(mapa);

/* ============ Preferencias ============ */
const selCarb = document.getElementById("carburante");
for (const [k, f] of Object.entries(FUELS)) {
  const o = document.createElement("option");
  o.value = k; o.textContent = f.label;
  selCarb.appendChild(o);
}
selCarb.value = prefs.fuel || "GASOLINA_95";
document.getElementById("radio").value = prefs.radius || 3;
document.getElementById("radioVal").textContent = prefs.radius || 3;
document.getElementById("soloRuta").checked = !!prefs.soloRuta;
let marcasSel = new Set(prefs.brands || []);

function guardarPrefs() {
  prefs = { fuel: selCarb.value, radius: +document.getElementById("radio").value,
            soloRuta: document.getElementById("soloRuta").checked, brands: [...marcasSel] };
  localStorage.setItem("gasolineras_prefs", JSON.stringify(prefs));
}

/* ============ Utilidades ============ */
const numEs = v => {
  const n = parseFloat(String(v ?? "").replace(",", "."));
  return Number.isFinite(n) ? n : null;
};
function estado(msg) { document.getElementById("estado").textContent = msg; }

const distKm = (a, b) => {
  const kx = 111.32 * Math.cos(a[0] * Math.PI / 180);
  return Math.hypot((a[1] - b[1]) * kx, (a[0] - b[0]) * 111.32);
};

function distPuntoSegmentoKm(p, a, b) {
  const kx = 111.32 * Math.cos(p[0] * Math.PI / 180);
  const [px, py] = [p[1] * kx, p[0] * 111.32];
  const [ax, ay] = [a[1] * kx, a[0] * 111.32];
  const [bx, by] = [b[1] * kx, b[0] * 111.32];
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  const t = l2 === 0 ? 0 : Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function distARutaKm(p, ruta) {
  if (!ruta || ruta.length === 0) return Infinity;
  if (ruta.length === 1) return distKm(p, ruta[0]);
  let min = Infinity;
  for (let i = 0; i < ruta.length - 1; i++)
    min = Math.min(min, distPuntoSegmentoKm(p, ruta[i], ruta[i + 1]));
  return min;
}

/* Identifica el código de provincia a través del código postal o nombre */
function extraerCodProvincia(address = {}) {
  if (address.postcode) {
    const cp = String(address.postcode).trim().padStart(5, "0");
    const cod = cp.slice(0, 2);
    if (+cod >= 1 && +cod <= 52) return cod;
  }
  const clave = (address.province || address.state || "").toLowerCase().trim();
  for (const [nom, cod] of Object.entries(PROVINCIAS_MAP)) {
    if (clave.includes(nom)) return cod;
  }
  return null;
}

async function fetchConProxy(url) {
  const intentos = [
    // 1º Petición directa al MITECO: Accept es CORS-safelisted (no lanza preflight OPTIONS)
    () => fetch(url, {
      headers: { "Accept": "application/json" }
    }),
    // 2º Petición directa sin cabeceras (devuelve XML o JSON según navegador)
    () => fetch(url),
    // 3º Respaldo con AllOrigins modo JSON (/get suele dar menos errores de cabeceras que /raw)
    async () => {
      const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      return new Response(data.contents);
    },
    // 4º Respaldo con CodeTabs
    () => fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`)
  ];

  for (const ejecutarFetch of intentos) {
    try {
      estado("Descargando datos de gasolineras…");
      const resp = await ejecutarFetch();
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const texto = (await resp.text()).trim();
      if (!texto) throw new Error("Respuesta vacía");

      if (texto.startsWith("<")) {
        return xmlAEstaciones(texto);   // Respuesta XML del MITECO
      }
      return JSON.parse(texto);          // Respuesta JSON del MITECO
    } catch (e) {
      console.warn("Intento de descarga falló:", e.message);
    }
  }
  throw new Error("No se pudo descargar la información de las gasolineras.");
}

/* Decodifica etiquetas .NET: Precio_x0020_Gasoleo_x0020_A -> "Precio Gasoleo A" */
function decodificarTag(tag) {
  return tag.replace(/_x([0-9A-Fa-f]{4})_/g,
    (_, h) => String.fromCharCode(parseInt(h, 16)));
}

/* Convierte el XML del servicio FiltroProvincia al mismo formato que el JSON:
   { ListaEESSPrecio: [ { "Rótulo": ..., "Latitud": ..., ... }, ... ] } */
function xmlAEstaciones(texto) {
  const doc = new DOMParser().parseFromString(texto, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("XML mal formado");
  const items = [...doc.querySelectorAll("EESSPrecio")];
  if (items.length === 0) throw new Error("El XML no contiene estaciones");
  return {
    Fecha: doc.querySelector("Fecha")?.textContent || "",
    ListaEESSPrecio: items.map(el => {
      const obj = {};
      for (const child of el.children) {
        obj[decodificarTag(child.tagName)] = child.textContent;
      }
      return obj;
    })
  };
}

/* ============ Carga de gasolineras por provincia ============ */
async function cargarProvincia(codProvincia, forzar = false) {
  if (!codProvincia) return;
  if (!forzar && provinciasCargadas.has(codProvincia)) return;

  const hoy = new Date().toISOString().slice(0, 10);
  const cacheKey = `gasolineras_prov_${codProvincia}`;
  const cache = JSON.parse(localStorage.getItem(cacheKey) || "null");

  if (!forzar && cache && cache.fecha === hoy) {
    incorporarEstaciones(cache.datos);
    provinciasCargadas.add(codProvincia);
    calcularAntiguedadPrecios(codProvincia);
    return;
  }

  estado(`Descargando datos de la provincia (${codProvincia})…`);
  try {
    const url = `${API_PROVINCIA}${codProvincia}`;
    const json = await fetchConProxy(url);
    const fechaMiteco = (json.Fecha || "").split(" ")[0] || hoy;

    const nuevas = (json.ListaEESSPrecio || []).map(e => ({
      id: `${e["IDEESS"] || e["Rótulo"]}-${e["Latitud"]}-${e["Longitud (WGS84)"]}`,
      ideess: e["IDEESS"] || "",
      codProvincia,
      fechaMiteco,
      rotulo: e["Rótulo"] || "Sin nombre",
      direccion: [e["Dirección"], e["Localidad"], e["Provincia"]].filter(Boolean).join(", "),
      lat: numEs(e["Latitud"]),
      lon: numEs(e["Longitud (WGS84)"]),
      horario: e["Horario"] || "",
      precios: Object.fromEntries(Object.entries(FUELS).map(([k, f]) => [k, numEs(e[f.campo])]))
    })).filter(e => e.lat !== null && e.lon !== null);

    localStorage.setItem(cacheKey, JSON.stringify({ fecha: hoy, datos: nuevas }));
    incorporarEstaciones(nuevas);
    provinciasCargadas.add(codProvincia);
    calcularAntiguedadPrecios(codProvincia);
  } catch (err) {
    estado("Error cargando provincia: " + err.message);
  }
}

function incorporarEstaciones(lista) {
  const ids = new Set(estaciones.map(e => e.id));
  for (const item of lista) {
    if (!ids.has(item.id)) {
      item.marca = normalizarMarca(item.rotulo);
      estaciones.push(item);
      ids.add(item.id);
    }
  }
  // Limpiar de marcasSel posibles nombres antiguos que no coincidan con marcas actuales
  const marcasValidas = new Set(estaciones.map(e => e.marca));
  marcasSel = new Set([...marcasSel].map(normalizarMarca).filter(m => marcasValidas.has(m)));

  construirFiltroMarcas();
  pintar();
}

function construirFiltroMarcas() {
  const cont = document.getElementById("marcas");
  cont.innerHTML = "";

  // Contar cuántas estaciones hay de cada marca
  const conteo = new Map();
  for (const e of estaciones) {
    conteo.set(e.marca, (conteo.get(e.marca) || 0) + 1);
  }
  const marcas = [...conteo.keys()].sort((a, b) => a.localeCompare(b, "es"));

  if (marcas.length === 0) {
    cont.innerHTML = `<em style="font-size:.8rem">Sin gasolineras</em>`;
    return;
  }
  const todas = document.createElement("label");
  todas.innerHTML = `<input type="checkbox" id="chkTodas" ${marcasSel.size === 0 ? "checked" : ""}> Todas (${marcas.length})`;
  cont.appendChild(todas);
  todas.querySelector("input").onchange = e => {
    marcasSel = e.target.checked ? new Set() : new Set(marcas);
    guardarPrefs(); construirFiltroMarcas(); pintar();
  };
  for (const m of marcas) {
    const lb = document.createElement("label");
    lb.innerHTML = `<input type="checkbox" ${marcasSel.has(m) ? "checked" : ""}> ${m} (${conteo.get(m)})`;
    lb.querySelector("input").onchange = ev => {
      ev.target.checked ? marcasSel.add(m) : marcasSel.delete(m);
      guardarPrefs(); pintar();
    };
    cont.appendChild(lb);
  }
}

/* Calcula un color progresivo entre verde (120º), amarillo (60º) y rojo (0º) */
function colorPorPrecio(precio, min, max) {
  const ratio = max > min ? (precio - min) / (max - min) : 0;
  const hue = Math.round((1 - ratio) * 120);
  return `hsl(${hue}, 82%, 40%)`;
}

/* Genera un marcador SVG con el color correspondiente al precio */
function crearIconoGasolinera(color) {
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="38" viewBox="0 0 26 38">
      <path d="M13 1C6.37 1 1 6.37 1 13c0 8.8 12 23.5 12 23.5S25 21.8 25 13c0-6.63-5.37-12-12-12z"
            fill="${color}" stroke="#ffffff" stroke-width="2"/>
      <circle cx="13" cy="13" r="4.5" fill="#ffffff"/>
    </svg>`;
  return L.divIcon({
    className: "icono-gasolinera",
    html: svg,
    iconSize: [26, 38],
    iconAnchor: [13, 37],
    popupAnchor: [0, -34]
  });
}

/* ============ Pintar en el mapa ============ */
function pintar() {
  guardarPrefs();
  capaEstaciones.clearLayers();
  const fuel = selCarb.value;
  const limite = document.getElementById("soloRuta").checked ? 0.15 : +document.getElementById("radio").value;
  const filtroAnt = document.getElementById("antiguedad").value;
  
  const filtradas = estaciones.filter(e =>
    (marcasSel.size === 0 || marcasSel.has(e.marca)) &&
    e.precios[fuel] != null &&
    cumpleFiltroAntiguedad(e, fuel, filtroAnt) &&
    (ruta ? distARutaKm([e.lat, e.lon], ruta) <= limite
        : (userPos ? distKm([e.lat, e.lon], userPos) <= 15 : false))
);

  // Ordenar de menor a mayor precio
  filtradas.sort((a, b) => a.precios[fuel] - b.precios[fuel]);

  // Precios extremo inferior y superior para la escala de color
  const minPrecio = filtradas.length ? filtradas[0].precios[fuel] : 0;
  const maxPrecio = filtradas.length ? filtradas[filtradas.length - 1].precios[fuel] : 0;

  const marcadoresPorId = new Map();

  for (const e of filtradas) {
    const precio = e.precios[fuel];
    const color = colorPorPrecio(precio, minPrecio, maxPrecio);

    const distTexto = (!ruta && userPos)
      ? `<br><small>📍 A ${distKm([e.lat, e.lon], userPos).toFixed(1)} km de tu ubicación</small>`
      : "";

    const btnHist = e.ideess
      ? `<br><button class="sec" style="margin-top:6px;padding:4px 6px;font-size:.78rem" onclick="verEvolucion('${e.ideess}', '${e.codProvincia}', '${e.id}')">📈 Ver evolución (7 días)</button><div id="grafica-${e.ideess}"></div>`
      : "";

	const marker = L.marker([e.lat, e.lon], { icon: crearIconoGasolinera(color) }).bindPopup(
	  `<b>${e.rotulo}</b><br><small>${e.direccion}</small><br>` +
	  `<span class="precio" style="color:${color}">${FUELS[fuel].label}: ${precio.toFixed(3)} €/l</span>` +
	  `<br><small>${textoAntiguedad(e, fuel)}</small>` +
	  distTexto +
	  (e.horario ? `<br><small>${e.horario}</small>` : "") +
	  btnHist
	).addTo(capaEstaciones);

    marcadoresPorId.set(e.id, marker);
  }

  // Renderizar listado de las más baratas en el panel lateral
  const contLista = document.getElementById("listaBaratas");
  contLista.innerHTML = "";

  if (filtradas.length === 0) {
    contLista.innerHTML = `<em style="font-size:.8rem; color:#666">Ninguna gasolinera cumple el filtro.</em>`;
  } else {
    for (const [idx, e] of filtradas.slice(0, 20).entries()) {
      const precio = e.precios[fuel];
      const color = colorPorPrecio(precio, minPrecio, maxPrecio);
      const card = document.createElement("div");
      card.className = "item-gasolinera";

      // Mostrar distancia a la ubicación solo si NO estamos en una ruta
      const textoDistancia = (!ruta && userPos)
        ? `📍 ${distKm([e.lat, e.lon], userPos).toFixed(1)} km · `
        : "";

	  card.innerHTML = `
	    <div class="info">
  	      <div class="nombre">${idx + 1}. ${e.rotulo}</div>
		  <div class="meta">${textoDistancia}${e.direccion}</div>
		  <div class="meta">${textoAntiguedad(e, fuel)}</div>
	    </div>
	    <div class="importe" style="color:${color}">${precio.toFixed(3)} €</div>
	`;

      card.onclick = () => {
        mapa.setView([e.lat, e.lon], 15);
        const m = marcadoresPorId.get(e.id);
        if (m) m.openPopup();
      };
      contLista.appendChild(card);
    }
  }

  estado(`${filtradas.length} gasolineras visibles · ${FUELS[fuel].label}` +
         (ruta ? " · ruta activa" : ""));
}

/* ============ Fijar Origen y Ubicación ============ */
async function fijarOrigenConCoords(lat, lon, zoom = 13, codProvincia = null) {
  userPos = [lat, lon];
  if (marcadorUsuario) mapa.removeLayer(marcadorUsuario);
  marcadorUsuario = L.marker([lat, lon], { icon: iconoUsuario, zIndexOffset: 1000 }).addTo(mapa)
    .bindPopup("<b>Tu ubicación / Origen</b>").openPopup();
  mapa.setView([lat, lon], zoom);

  if (!codProvincia) {
    estado("Determinando provincia…");
    try {
      const resp = await fetch(`${NOMINATIM_REVERSE}&lat=${lat}&lon=${lon}`);
      const data = await resp.json();
      codProvincia = extraerCodProvincia(data.address);
    } catch (_) {}
  }

  if (codProvincia) {
    await cargarProvincia(codProvincia);
  } else {
    estado("No se pudo determinar la provincia correspondiente.");
  }
  pintar();
}

document.getElementById("btnGps").onclick = () => {
  estado("Obteniendo ubicación GPS…");
  navigator.geolocation.getCurrentPosition(
    pos => fijarOrigenConCoords(pos.coords.latitude, pos.coords.longitude),
    err => estado("Error GPS: " + err.message + ". Introduce una dirección.")
  );
};

document.getElementById("btnDir").onclick = async () => {
  const q = document.getElementById("direccion").value.trim();
  if (!q) return;
  estado("Buscando dirección…");
  try {
    const r = await fetch(NOMINATIM_SEARCH + encodeURIComponent(q));
    const res = await r.json();
    if (res.length === 0) { estado("Dirección no encontrada"); return; }
    const cod = extraerCodProvincia(res[0].address);
    fijarOrigenConCoords(+res[0].lat, +res[0].lon, 13, cod);
  } catch (e) { estado("Error: " + e.message); }
};

/* ============ Rutas ============ */
document.getElementById("btnRuta").onclick = async () => {
  const q = document.getElementById("destino").value.trim();
  if (!q) return;
  if (!userPos) { estado("Indica primero tu ubicación de origen"); return; }
  estado("Calculando ruta…");
  try {
    const r = await fetch(NOMINATIM_SEARCH + encodeURIComponent(q));
    const res = await r.json();
    if (res.length === 0) { estado("Destino no encontrado"); return; }
    
    const codDest = extraerCodProvincia(res[0].address);
    if (codDest && !provinciasCargadas.has(codDest)) {
      await cargarProvincia(codDest);
    }

    const dest = [+res[0].lat, +res[0].lon];
    const url = `${OSRM}${userPos[1]},${userPos[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson`;
    const rr = await fetch(url);
    const rjson = await rr.json();
    if (rjson.code !== "Ok") { estado("No se pudo calcular la ruta"); return; }

    ruta = rjson.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    capaRuta.clearLayers();
    L.polyline(ruta, { color: "#1565C0", weight: 6 }).addTo(capaRuta);
    mapa.fitBounds(L.latLngBounds(ruta));
    pintar();
  } catch (e) { estado("Error de ruta: " + e.message); }
};

document.getElementById("btnQuitarRuta").onclick = () => {
  ruta = null;
  capaRuta.clearLayers();
  pintar();
};

/* ============ Controles de Preferencias ============ */
selCarb.onchange = pintar;
document.getElementById("soloRuta").onchange = pintar;
document.getElementById("radio").oninput = e => {
  document.getElementById("radioVal").textContent = e.target.value;
  pintar();
};
document.getElementById("btnActualizar").onclick = async () => {
  for (const cod of [...provinciasCargadas]) {
    await cargarProvincia(cod, true);
  }
};
document.getElementById("antiguedad").onchange = pintar;

/* ============ Inicio automático ============ */
if (navigator.geolocation) {
  estado("Obteniendo tu ubicación…");
  navigator.geolocation.getCurrentPosition(
    pos => fijarOrigenConCoords(pos.coords.latitude, pos.coords.longitude),
    () => estado("Introduce una dirección o pulsa «Usar mi ubicación».")
  );
} else {
  estado("Introduce una dirección para buscar gasolineras.");
}

const API_HIST_PROVINCIA = "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestresHist/FiltroProvincia/";

/* Formatea un objeto Date a DD-MM-YYYY para el endpoint histórico del MITECO */
function formatearFechaMiteco(date) {
  const d = String(date.getDate()).padStart(2, "0");
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const y = date.getFullYear();
  return `${d}-${m}-${y}`;
}

/* Obtiene (o recupera de caché) los precios históricos de una provincia en una fecha DD-MM-YYYY */
async function obtenerHistoricoDiaProvincia(codProvincia, fechaStr) {
  const cacheKey = `gas_hist_${codProvincia}_${fechaStr}`;
  const cacheado = localStorage.getItem(cacheKey);
  if (cacheado) return JSON.parse(cacheado);

  const url = `${API_HIST_PROVINCIA}${fechaStr}/${codProvincia}`;
  const json = await fetchConProxy(url);
  const mapaDia = {};

  for (const e of (json.ListaEESSPrecio || [])) {
    const id = e["IDEESS"];
    if (!id) continue;
    mapaDia[id] = Object.fromEntries(
      Object.entries(FUELS)
        .map(([k, f]) => [k, numEs(e[f.campo])])
        .filter(([, val]) => val !== null)
    );
  }

  try {
    localStorage.setItem(cacheKey, JSON.stringify(mapaDia));
  } catch (_) {
    // Si localStorage se llena, borra históricos antiguos
    Object.keys(localStorage)
      .filter(k => k.startsWith("gas_hist_"))
      .slice(0, 5)
      .forEach(k => localStorage.removeItem(k));
  }
  return mapaDia;
}

/* Carga los últimos 7 días sin arrastrar ni inventar precios en días sin reporte o sin cambios */
async function verEvolucion(ideess, codProvincia, idEstacion) {
  const cont = document.getElementById(`grafica-${ideess}`);
  if (!cont) return;
  const fuel = selCarb.value;
  cont.innerHTML = `<small style="color:#666">Cargando histórico de 7 días…</small>`;

  try {
    const hoy = new Date();
    const fechas = [];
    for (let i = 6; i >= 1; i--) {
      const d = new Date(hoy);
      d.setDate(hoy.getDate() - i);
      fechas.push({
        etiqueta: `${d.getDate()}/${d.getMonth() + 1}`,
        fechaMiteco: formatearFechaMiteco(d)
      });
    }

    const resultados = await Promise.all(
      fechas.map(f => obtenerHistoricoDiaProvincia(codProvincia, f.fechaMiteco).catch(() => null))
    );

    // Construimos la serie de 7 días (índices 0 a 6). Si un día no hay dato, queda en null.
    const serie = fechas.map((f, idx) => ({
      idx,
      etiqueta: f.etiqueta,
      precio: resultados[idx]?.[ideess]?.[fuel] ?? null
    }));

    const estHoy = estaciones.find(e => e.id === idEstacion);
    serie.push({
      idx: 6,
      etiqueta: "Hoy",
      precio: estHoy?.precios?.[fuel] ?? null
    });

    // Filtrar solo los días donde realmente hubo dato y cambio de precio (más el inicio y Hoy)
    const puntosReales = [];
    let ultimoPrecioConocido = null;

    for (let i = 0; i < serie.length; i++) {
      const item = serie[i];
      if (item.precio === null) continue; // Si ese día no hay dato, NO se usa el del día anterior

      const esPrimero = ultimoPrecioConocido === null;
      const esHoy = i === serie.length - 1;
      const huboCambio = !esPrimero && Math.abs(item.precio - ultimoPrecioConocido) >= 0.0005;

      if (esPrimero || huboCambio || esHoy) {
        puntosReales.push(item);
        ultimoPrecioConocido = item.precio;
      }
    }

    if (puntosReales.length === 0) {
      cont.innerHTML = `<small style="color:#c62828">Sin datos históricos disponibles.</small>`;
      return;
    }

    cont.innerHTML = generarSvgGrafica(serie, puntosReales);
  } catch (e) {
    cont.innerHTML = `<small style="color:#c62828">Error al cargar histórico.</small>`;
  }
}

/* Dibuja la gráfica respetando los huecos y marcando solo los cambios reales de precio */
function generarSvgGrafica(serieCompleta, puntosReales) {
  const w = 240, h = 115, padX = 28, padY = 24;
  const precios = puntosReales.map(p => p.precio);
  let min = Math.min(...precios), max = Math.max(...precios);
  const sinCambios = Math.abs(max - min) < 0.0005;
  if (sinCambios) { min -= 0.02; max += 0.02; }

  const xPos = idx => padX + (idx / (serieCompleta.length - 1)) * (w - padX * 2);
  const yPos = precio => padY + (1 - (precio - min) / (max - min)) * (h - padY * 2);

  const coords = puntosReales.map(p => ({
    x: xPos(p.idx),
    y: yPos(p.precio),
    ...p
  }));

  const polilinea = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");

  return `
    <svg width="${w}" height="${h}" style="margin-top:6px;background:#f8f9fa;border:1px solid #ddd;border-radius:6px;display:block">
      ${coords.length > 1
        ? `<polyline fill="none" stroke="#1565C0" stroke-width="2" stroke-dasharray="${sinCambios ? "4,3" : "none"}" points="${polilinea}" />`
        : ""}
      ${coords.map(c => `
        <circle cx="${c.x}" cy="${c.y}" r="3.5" fill="#2E7D32" />
        <text x="${c.x}" y="${c.y - 7}" font-size="9" text-anchor="middle" fill="#222" font-weight="600">${c.precio.toFixed(3)}</text>
      `).join("")}
      ${serieCompleta.map(s => `
        <text x="${xPos(s.idx)}" y="${h - 6}" font-size="8" text-anchor="middle" fill="${s.precio !== null ? "#555" : "#bbb"}">${s.etiqueta}</text>
      `).join("")}
    </svg>
    ${sinCambios ? `<small style="color:#666;display:block;margin-top:2px;font-size:.72rem">Sin variaciones de precio en los días consultados.</small>` : ""}
  `;
}

/* Calcula cuántos días lleva sin cambiar el precio de cada gasolinera de la provincia */
async function calcularAntiguedadPrecios(codProvincia) {
  const hoy = new Date();
  const diasAtras = [1, 2, 3, 4].map(d => {
    const fecha = new Date(hoy);
    fecha.setDate(hoy.getDate() - d);
    return { dias: d, fechaStr: formatearFechaMiteco(fecha) };
  });

  try {
    const historicos = await Promise.all(
      diasAtras.map(d => obtenerHistoricoDiaProvincia(codProvincia, d.fechaStr).catch(() => ({})))
    );

    const fechaHoyStr = formatearFechaMiteco(hoy);

    for (const e of estaciones) {
      if (e.codProvincia !== codProvincia || !e.ideess) continue;
      e.antiguedad = {};

      for (const fuel of Object.keys(FUELS)) {
        const precioHoy = e.precios[fuel];
        if (precioHoy == null) continue;

        let diasSinActualizar = 0;
        let fechaPrecio = e.fechaMiteco || fechaHoyStr;

        for (let i = 0; i < diasAtras.length; i++) {
          const precioPasado = historicos[i]?.[e.ideess]?.[fuel];
          if (precioPasado != null && Math.abs(precioPasado - precioHoy) < 0.0005) {
            diasSinActualizar = diasAtras[i].dias;
            fechaPrecio = diasAtras[i].fechaStr;
          } else {
            break; // El precio cambió respecto a este día
          }
        }

        e.antiguedad[fuel] = { dias: diasSinActualizar, fecha: fechaPrecio };
      }
    }
    pintar();
  } catch (err) {
    console.warn("No se pudo calcular la antigüedad de precios:", err);
  }
}

/* Formatea el texto de antigüedad y fecha del precio */
function textoAntiguedad(estacion, fuel) {
  const info = estacion.antiguedad?.[fuel];
  if (!info) {
    return estacion.fechaMiteco ? `📅 Fecha MITECO: ${estacion.fechaMiteco}` : "📅 Calculando antigüedad…";
  }
  if (info.dias === 0) return `🟢 Actualizado hoy (${info.fecha})`;
  if (info.dias === 1) return `🕒 1 día sin cambios (desde ${info.fecha})`;
  if (info.dias === 2) return `🕒 2 días sin cambios (desde ${info.fecha})`;
  if (info.dias === 3) return `⚠️ 3 días sin cambios (desde ${info.fecha})`;
  return `⚠️ +3 días sin actualizar (≤ ${info.fecha})`;
}

/* Comprueba si una estación cumple el filtro de antigüedad seleccionado */
function cumpleFiltroAntiguedad(estacion, fuel, filtro) {
  if (filtro === "TODAS") return true;
  const info = estacion.antiguedad?.[fuel];
  if (!info) return true; // Mientras termina de cargar el histórico no las oculta

  if (filtro === "0") return info.dias === 0;
  if (filtro === "1") return info.dias <= 1;
  if (filtro === "2") return info.dias <= 2;
  if (filtro === "3") return info.dias <= 3;
  if (filtro === "EXACTO_1") return info.dias === 1;
  if (filtro === "EXACTO_2") return info.dias === 2;
  if (filtro === "MAS_3") return info.dias > 3;
  return true;
}
