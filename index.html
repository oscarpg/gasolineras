<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasolineras España</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --azul:#1565C0; --verde:#2E7D32; --borde:#ddd; --sombra: 0 4px 14px rgba(0,0,0,0.18); }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Arial, sans-serif; height:100vh; width:100vw; overflow:hidden; position:relative; }

  /* Mapa a pantalla completa */
  #mapa { width:100%; height:100%; z-index:1; }

  /* Barra superior flotante limpia */
  #topbar {
    position: absolute;
    top: 12px;
    left: 54px; /* Espacio para controles de zoom de Leaflet */
    right: 12px;
    z-index: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }
  .topbar-card {
    pointer-events: auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: var(--sombra);
    border: 1px solid var(--borde);
    display: flex;
    align-items: center;
    padding: 4px;
    gap: 6px;
  }
  #btnAbrirPrefs {
    width: auto; margin: 0; padding: 7px 12px; font-weight: 600; font-size: .85rem;
    display: flex; align-items: center; gap: 6px;
  }
  .icono-movil { display: none; font-size: 1.15rem; line-height: 1; }
  .icono-web { display: inline; }

  #btnGpsRapido {
    width: auto; margin: 0; padding: 7px 10px; font-size: 1rem;
  }

  /* Tarjeta flotante: Listado de más baratas */
  #panelBaratas {
    position: absolute;
    bottom: 20px;
    left: 12px;
    width: 370px;
    max-width: calc(100vw - 24px);
    max-height: 48vh;
    background: #fff;
    border-radius: 10px;
    box-shadow: var(--sombra);
    border: 1px solid var(--borde);
    z-index: 500;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  #panelBaratas.minimizado {
    max-height: 42px !important;
  }
  .cabecera-baratas {
    padding: 10px 12px;
    background: var(--azul);
    color: #fff;
    font-weight: 600;
    font-size: .88rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
    min-height: 42px;
  }
  .opciones-baratas {
    padding: 6px 10px;
    background: #eef6ff;
    border-bottom: 1px solid #b3d4fc;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .78rem;
    color: #1565C0;
    font-weight: 600;
    flex-shrink: 0;
  }
  .opciones-baratas.deshabilitado {
    background: #f5f5f5;
    border-bottom-color: var(--borde);
    color: #888;
    font-weight: 400;
  }
  .opciones-baratas input[type="checkbox"] {
    margin: 0;
    cursor: pointer;
  }
  .opciones-baratas label {
    margin: 0;
    cursor: pointer;
    font-size: .78rem;
    color: inherit;
    user-select: none;
  }
  #estado {
    font-size: .74rem;
    color: #555;
    padding: 5px 10px;
    background: #f5f7fa;
    border-bottom: 1px solid var(--borde);
    flex-shrink: 0;
  }
  #listaBaratas {
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    flex: 1;
  }

  /* Drawer lateral de Preferencias */
  #backdropPrefs {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 900;
    display: none;
  }
  #backdropPrefs.activo { display: block; }

  #drawerPrefs {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 380px;
    max-width: 92vw;
    background: #fafafa;
    z-index: 1000;
    box-shadow: 4px 0 18px rgba(0,0,0,0.25);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
  }
  #drawerPrefs.abierto { transform: translateX(0); }

  .drawer-header {
    padding: 12px 16px;
    background: var(--azul);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .drawer-header h2 { margin: 0; font-size: 1.05rem; }
  #btnCerrarPrefs {
    width: auto; margin: 0; padding: 4px 10px; background: rgba(255,255,255,0.2);
    color: #fff; font-size: 1rem; border-radius: 6px;
  }
  .drawer-body {
    padding: 12px;
    overflow-y: auto;
    flex: 1;
  }

  /* Formularios y controles dentro de Preferencias */
  fieldset {
    border: 1px solid var(--borde);
    border-radius: 8px;
    margin: 0 0 12px;
    padding: 8px 10px;
    background: #fff;
    min-width: 0;
    max-width: 100%;
  }
  legend { font-size:.85rem; font-weight:600; color:#555; padding:0 4px; }
  label { display:block; font-size:.82rem; margin:6px 0 2px; color:#333; }
  select, input[type=text], input[type=number] {
    width:100%; padding:6px; border:1px solid var(--borde); border-radius:6px; font-size:.88rem;
  }
  input[type=range] { width:100%; }
  .fila { display:flex; gap:8px; align-items:center; margin-top:6px; }
  button {
    cursor:pointer; border:none; border-radius:6px; padding:8px 10px;
    font-size:.88rem; background:var(--azul); color:#fff; width:100%; margin-top:6px;
  }
  button.sec { background:#fff; color:var(--azul); border:1px solid var(--azul); }
  button:hover { opacity:.92; }

  #marcas { max-height:140px; overflow-y:auto; border:1px solid var(--borde); border-radius:6px; padding:4px; background:#fff; }
  #marcas label { margin:2px 0; font-size:.82rem; display:flex; gap:6px; align-items:center; }

  /* Tarjetas de coches y descuentos */
  .coche-item, .desc-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #eef6ff; border: 1px solid #b3d4fc; border-radius: 6px;
    padding: 6px 8px; font-size: .8rem; margin-top: 6px; gap: 6px;
  }
  .coche-item.activo {
    background: #e8f5e9; border-color: #81c784;
  }
  .coche-info { flex: 1; min-width: 0; }
  .coche-acciones { display: flex; gap: 4px; align-items: center; }
  .btn-mini {
    width: auto; margin: 0; padding: 3px 7px; font-size: .75rem; border-radius: 4px;
  }
  .btn-del {
    width: auto; margin: 0; padding: 2px 6px; background: transparent;
    color: #c62828; font-weight: 700; font-size: .85rem;
  }

  /* Items de gasolineras */
  .precio { font-weight:700; color:var(--verde); }
  .popup small { color:#666; }
  .marcador-usuario {
    background-color: #D32F2F;
    border: 3px solid #FFFFFF;
    border-radius: 50%;
    box-shadow: 0 0 0 5px rgba(211, 47, 47, 0.35), 0 2px 6px rgba(0, 0, 0, 0.45);
  }
  .icono-gasolinera {
    background: transparent;
    border: none;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
  }
  .item-gasolinera {
    border: 1px solid var(--borde);
    border-radius: 6px;
    padding: 6px 8px;
    background: #fff;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .item-gasolinera:hover { background: #f0f6ff; border-color: var(--azul); }
  .item-gasolinera .info { flex: 1 1 0%; min-width: 0; overflow: hidden; }
  .item-gasolinera .nombre {
    font-size: .82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-gasolinera .meta {
    font-size: .73rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-gasolinera .meta-coche {
    font-size: .72rem; color: #1565C0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 1px;
  }
  .item-gasolinera .importe {
    font-size: .95rem; font-weight: 700; color: var(--verde); white-space: nowrap; flex-shrink: 0;
  }
  .item-gasolinera .sub-importe {
    font-size: .72rem; color: #1565C0; font-weight: 600; white-space: nowrap;
  }
  .precio-tachado {
    text-decoration: line-through; color: #888; font-size: .75rem; font-weight: 400; margin-left: 4px;
  }
  .badge-desc {
    background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7;
    border-radius: 4px; padding: 1px 4px; font-size: .68rem; font-weight: 600;
    margin-left: 4px; vertical-align: middle;
  }

  @media (max-width: 700px) {
    .icono-movil { display: inline; }
    .icono-web { display: none; }
    #panelBaratas {
      width: calc(100vw - 24px);
      bottom: 12px;
      max-height: 42vh;
    }
  }
</style>
</head>
<body>

<!-- Barra superior flotante limpia en pantalla principal -->
<div id="topbar">
  <div class="topbar-card">
    <button id="btnAbrirPrefs" title="Abrir Preferencias">
      <span class="icono-movil">☰</span>
      <span class="icono-web">⚙️ Preferencias</span>
    </button>
  </div>
  <div class="topbar-card">
    <button class="sec" id="btnGpsRapido" title="Usar mi ubicación GPS">📍</button>
  </div>
</div>

<!-- Mapa principal a pantalla completa -->
<div id="mapa"></div>

<!-- Listado flotante de gasolineras más baratas -->
<div id="panelBaratas">
  <div class="cabecera-baratas" id="toggleBaratas">
    <span>⛽ Gasolineras más baratas</span>
    <span id="iconoToggleBaratas">▼</span>
  </div>
  <div class="opciones-baratas" id="contenedorChkCoste">
    <input type="checkbox" id="chkOrdenCosteReal">
    <label for="chkOrdenCosteReal" id="lblOrdenCosteReal">Ordenar por coste total (depósito + ida y vuelta)</label>
  </div>
  <div id="estado">Esperando ubicación…</div>
  <div id="listaBaratas">
    <em style="font-size:.8rem; color:#666">Sin datos para mostrar…</em>
  </div>
</div>

<!-- Fondo oscuro y Panel lateral de Preferencias -->
<div id="backdropPrefs"></div>
<aside id="drawerPrefs">
  <div class="drawer-header">
    <h2>⚙️ Preferencias y Filtros</h2>
    <button id="btnCerrarPrefs" title="Cerrar">✕</button>
  </div>
  <div class="drawer-body">

    <!-- 1. Mis Coches -->
    <fieldset>
      <legend>🚗 Mis coches</legend>
      <label for="cocheNombre">Nombre del coche:</label>
      <input type="text" id="cocheNombre" placeholder="Ej: SEAT León">

      <div class="fila">
        <div style="flex:1">
          <label for="cocheFuel">Combustible:</label>
          <select id="cocheFuel"></select>
        </div>
      </div>

      <div class="fila">
        <div style="flex:1">
          <label for="cocheDeposito">Depósito (litros):</label>
          <input type="number" id="cocheDeposito" placeholder="Ej: 50" min="5" max="200" step="1">
        </div>
        <div style="flex:1">
          <label for="cocheConsumo">Consumo (l/100km):</label>
          <input type="number" id="cocheConsumo" placeholder="Ej: 6.2" min="1" max="40" step="0.1">
        </div>
      </div>
      <button class="sec" id="btnGuardarCoche">Añadir / Guardar coche</button>
      <div id="listaCoches" style="margin-top:6px"></div>
    </fieldset>

    <!-- 2. Ubicación y Distancia máxima -->
    <fieldset>
      <legend>📍 Ubicación y Distancia</legend>
      <button id="btnGps" style="margin-top:0">Usar mi ubicación GPS</button>
      <label for="direccion">o buscar dirección:</label>
      <input type="text" id="direccion" placeholder="Calle, número, ciudad…">
      <button class="sec" id="btnDir">Establecer dirección</button>

      <label for="radioUbicacion" style="margin-top:10px">
        Distancia máxima admitida: <b><span id="radioUbicacionVal">15</span> km</b>
      </label>
      <input type="range" id="radioUbicacion" min="1" max="50" step="1" value="15">
    </fieldset>

    <!-- 3. Ruta -->
    <fieldset>
      <legend>🛣️ Ruta</legend>
      <label for="destino">Dirección de destino:</label>
      <input type="text" id="destino" placeholder="Ciudad o dirección de destino…">
      <button id="btnRuta">Calcular ruta</button>

      <label for="radio">Radio de desvío en ruta: <b><span id="radioVal">3</span> km</b></label>
      <input type="range" id="radio" min="1" max="10" step="0.5" value="3">

      <div class="fila">
        <input type="checkbox" id="soloRuta">
        <label for="soloRuta" style="margin:0">Solo gasolineras en la ruta (sin desvíos)</label>
      </div>

      <button class="sec" id="btnQuitarRuta">Quitar ruta</button>
    </fieldset>

    <!-- 4. Filtros de Carburante, Antigüedad y Marcas -->
    <fieldset>
      <legend>🔎 Filtros de gasolineras</legend>
      <label for="carburante">Carburante a mostrar:</label>
      <select id="carburante"></select>

      <label for="antiguedad">Filtro por días sin actualizar el precio:</label>
      <select id="antiguedad">
        <option value="TODAS">Todas las gasolineras</option>
        <option value="0">Actualizado hoy (0 días)</option>
        <option value="1">Sin actualizar ≤ 1 día (ocultar &gt; 1 día)</option>
        <option value="2">Sin actualizar ≤ 2 días (ocultar &gt; 2 días)</option>
        <option value="3">Sin actualizar ≤ 3 días (ocultar &gt; 3 días)</option>
        <option value="MAX_X">Sin actualizar ≤ X días (personalizado)…</option>
        <option value="EXACTO_1">Exactamente 1 día sin actualizar</option>
        <option value="EXACTO_2">Exactamente 2 días sin actualizar</option>
        <option value="MAS_3">Más de 3 días sin actualizar</option>
        <option value="MAS_X">Más de X días sin actualizar (personalizado)…</option>
      </select>

      <div id="filaDiasCustom" class="fila" style="display:none; margin-top:6px">
        <label for="diasAntiguedadVal" style="margin:0; flex:1">Número de días (X):</label>
        <input type="number" id="diasAntiguedadVal" min="1" max="10" step="1" value="3" style="width:80px">
      </div>
      <div id="infoEstadoAntiguedad" style="font-size:.74rem; color:#666; margin-top:4px"></div>

      <label style="margin-top:8px">Marcas permitidas:</label>
      <div id="marcas"><em style="font-size:.8rem">Esperando ubicación…</em></div>
    </fieldset>

    <!-- 5. Descuentos por marca -->
    <fieldset>
      <legend>🏷️ Descuentos por marca</legend>
      <label for="descMarca">Marca:</label>
      <select id="descMarca">
        <option value="">Selecciona una marca…</option>
      </select>
      <div class="fila">
        <input type="number" id="descValor" placeholder="Ej: 5" min="0" step="0.5" style="width:45%">
        <select id="descTipo" style="width:55%">
          <option value="CTS">cts/litro (ej. 5 cts)</option>
          <option value="PCT">% porcentaje (ej. 3%)</option>
        </select>
      </div>
      <button class="sec" id="btnAddDesc">Añadir / Actualizar descuento</button>
      <div id="listaDescuentos" style="margin-top:6px"></div>
    </fieldset>

    <button class="sec" id="btnActualizar" style="margin-bottom:14px">🔄 Forzar actualización de precios</button>
  </div>
</aside>

<script>
/* ============ Configuración ============ */
const FUELS = {
  GASOLEO_A:      { label:"Diésel",          campo:"Precio Gasoleo A" },
  GASOLEO_PREMIUM:{ label:"Diésel Premium",  campo:"Precio Gasoleo Premium" },
  GASOLINA_95:    { label:"Gasolina 95",     campo:"Precio Gasolina 95 E5" },
  GASOLINA_98:    { label:"Gasolina 98",     campo:"Precio Gasolina 98 E5" },
  GLP:            { label:"Autogás (GLP)",   campo:"Precio Gases licuados del petróleo" },
  GNC:            { label:"GNC",             campo:"Precio Gas natural comprimido" },
  GNL:            { label:"GNL",             campo:"Precio Gas natural licuado" }
};

const API_PROVINCIA = "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroProvincia/";
const API_HIST_PROVINCIA = "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestresHist/FiltroProvincia/";
const OSRM = "https://router.project-osrm.org/route/v1/driving/";
const NOMINATIM_SEARCH = "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q=";
const NOMINATIM_REVERSE = "https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1";

const PROVINCIAS_MAP = {
  "alava":"01","araba":"01","albacete":"02","alicante":"03","alacant":"03","almeria":"04",
  "avila":"05","badajoz":"06","balears":"07","baleares":"07","barcelona":"08","burgos":"09",
  "caceres":"10","cadiz":"11","castellon":"12","castello":"12","ciudad real":"13","cordoba":"14",
  "coruña":"15","a coruña":"15","la coruña":"15","cuenca":"16","girona":"17","gerona":"17",
  "granada":"18","guadalajara":"19","gipuzkoa":"20","guipuzcoa":"20","huelva":"21","huesca":"22",
  "jaen":"23","leon":"24","lleida":"25","lerida":"25","rioja":"26","lugo":"27","madrid":"28",
  "malaga":"29","murcia":"30","navarra":"31","nafarroa":"31","ourense":"32","orense":"32",
  "asturias":"33","palencia":"34","palmas":"35","las palmas":"35","pontevedra":"36","salamanca":"37",
  "santa cruz de tenerife":"38","tenerife":"38","cantabria":"39","segovia":"40","sevilla":"41",
  "soria":"42","tarragona":"43","teruel":"44","toledo":"45","valencia":"46","valencia/valencia":"46",
  "valladolid":"47","bizkaia":"48","vizcaya":"48","zamora":"49","zaragoza":"50","ceuta":"51","melilla":"52"
};

const MARCAS_CONOCIDAS = [
  "REPSOL", "MOEVE", "CEPSA", "CARBUGAL", "GALP", "BP", "SHELL",
  "PLENOIL", "PLENERGY", "BALLENOIL", "PETROPRIX", "PETROCASH", "SBC", "ORTIGAL",
  "STAROIL", "VALCARCE", "GALURESA", "EROSKI", "CARREFOUR", "ALCAMPO",
  "BONAREA", "BONÀREA", "AVIA", "Q8", "PETRONOR", "CAMPSA", "DISA",
  "MEROIL", "BEROIL", "AUTONETOIL", "EASYGAS", "GAS EXPRESS", "GASEXPRESS",
  "OILPRIX", "COSTCO", "MAKRO", "LECLERC", "HAFESA", "AGLA", "MAXOIL",
  "FARRUCO", "IDS", "AS24", "DYNEFF", "TAMOIL", "AN ENERGETICOS"
];

function normalizarMarca(rotulo = "") {
  let limpio = rotulo.toUpperCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  for (const marca of MARCAS_CONOCIDAS) {
    const marcaNorm = marca.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const regex = new RegExp(`(^|[^A-Z0-9])${marcaNorm}([^A-Z0-9]|$)`);
    if (regex.test(limpio)) {
      return marca === "BONÀREA" ? "BONAREA" : marca;
    }
  }

  limpio = limpio
    .replace(/^(E\.?\s*S\.?|ESTACION\s+DE\s+SERVICIO|GASOLINERA|AREA\s+DE\s+SERVICIO)\s+/i, "")
    .split(/\s+[-/,]\s+/)[0]
    .trim();

  return limpio || "SIN MARCA";
}

const iconoUsuario = L.divIcon({
  className: "marcador-usuario",
  iconSize: [18, 18],
  iconAnchor: [9, 9],
  popupAnchor: [0, -10]
});

function colorPorValor(valor, min, max) {
  const ratio = max > min ? (valor - min) / (max - min) : 0;
  const hue = Math.round((1 - ratio) * 120);
  return `hsl(${hue}, 82%, 40%)`;
}

function crearIconoGasolinera(color) {
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="38" viewBox="0 0 26 38">
      <path d="M13 1C6.37 1 1 6.37 1 13c0 8.8 12 23.5 12 23.5S25 21.8 25 13c0-6.63-5.37-12-12-12z"
            fill="${color}" stroke="#ffffff" stroke-width="2"/>
      <circle cx="13" cy="13" r="4.5" fill="#ffffff"/>
    </svg>`;
  return L.divIcon({
    className: "icono-gasolinera",
    html: svg,
    iconSize: [26, 38],
    iconAnchor: [13, 37],
    popupAnchor: [0, -34]
  });
}

/* ============ Control de UI (Drawer y Panel flotante) ============ */
const drawerPrefs = document.getElementById("drawerPrefs");
const backdropPrefs = document.getElementById("backdropPrefs");

function abrirPreferencias() {
  drawerPrefs.classList.add("abierto");
  backdropPrefs.classList.add("activo");
}
function cerrarPreferencias() {
  drawerPrefs.classList.remove("abierto");
  backdropPrefs.classList.remove("activo");
}

document.getElementById("btnAbrirPrefs").onclick = abrirPreferencias;
document.getElementById("btnCerrarPrefs").onclick = cerrarPreferencias;
backdropPrefs.onclick = cerrarPreferencias;

document.getElementById("toggleBaratas").onclick = () => {
  const panel = document.getElementById("panelBaratas");
  const minimizado = panel.classList.toggle("minimizado");
  document.getElementById("iconoToggleBaratas").textContent = minimizado ? "▲" : "▼";
};

/* ============ Estado y Mapa ============ */
let estaciones = [];
let provinciasCargadas = new Set();
let maxDiasCalculadosPorProv = new Map();
let calculandoAntiguedad = false;
let userPos = null;
let ruta = null;
let capaEstaciones = null, capaRuta = null, marcadorUsuario = null;

/* ============ Descuentos y Costes ============ */
function obtenerPrecioEfectivo(estacion, fuel) {
  const base = estacion.precios?.[fuel];
  if (base == null) return null;
  const d = descuentos[estacion.marca];
  if (!d || !d.valor || d.valor <= 0) return base;

  const rebaja = d.tipo === "PCT" ? base * (d.valor / 100) : d.valor / 100;
  return Math.max(0, +(base - rebaja).toFixed(3));
}

function calcularDesgloseCoche(estacion, fuel, coche) {
  const precioFinal = obtenerPrecioEfectivo(estacion, fuel);
  const distUbicacion = userPos ? distKm([estacion.lat, estacion.lon], userPos) : null;
  const distDesvioRuta = ruta ? distARutaKm([estacion.lat, estacion.lon], ruta) : null;

  const distBaseKm = ruta ? distDesvioRuta : distUbicacion;

  if (!coche || precioFinal == null) {
    return {
      precioFinal,
      distUbicacion,
      distDesvioRuta,
      distIdaVueltaKm: distBaseKm != null ? distBaseKm * 2 : null,
      costeDeposito: null,
      litrosViaje: null,
      costeViaje: null,
      costeTotal: null
    };
  }

  const costeDeposito = coche.deposito * precioFinal;
  const distIdaVueltaKm = distBaseKm != null ? distBaseKm * 2 : 0;
  const litrosViaje = (distIdaVueltaKm * coche.consumo) / 100;
  const costeViaje = litrosViaje * precioFinal;
  const costeTotal = costeDeposito + costeViaje;

  return {
    precioFinal,
    distUbicacion,
    distDesvioRuta,
    distIdaVueltaKm,
    costeDeposito,
    litrosViaje,
    costeViaje,
    costeTotal
  };
}

function etiquetaDescuento(marca) {

  return d.tipo === "PCT" ? `-${d.valor}%` : `-${d.valor} cts/l`;
}

/* ============ Utilidades ============ */
const numEs = v => {
  const n = parseFloat(String(v ?? "").replace(",", "."));
  return Number.isFinite(n) ? n : null;
};
function estado(msg) { document.getElementById("estado").textContent = msg; }

const distKm = (a, b) => {
  const kx = 111.32 * Math.cos(a[0] * Math.PI / 180);
  return Math.hypot((a[1] - b[1]) * kx, (a[0] - b[0]) * 111.32);
};

function distPuntoSegmentoKm(p, a, b) {
  const kx = 111.32 * Math.cos(p[0] * Math.PI / 180);
  const [px, py] = [p[1] * kx, p[0] * 111.32];
  const [ax, ay] = [a[1] * kx, a[0] * 111.32];
  const [bx, by] = [b[1] * kx, b[0] * 111.32];
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  const t = l2 === 0 ? 0 : Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function distARutaKm(p, ruta) {
  if (!ruta || ruta.length === 0) return Infinity;
  if (ruta.length === 1) return distKm(p, ruta[0]);
  let min = Infinity;
  for (let i = 0; i < ruta.length - 1; i++)
    min = Math.min(min, distPuntoSegmentoKm(p, ruta[i], ruta[i + 1]));
  return min;
}

function extraerCodProvincia(address = {}) {
  if (address.postcode) {
    const cp = String(address.postcode).trim().padStart(5, "0");
    const cod = cp.slice(0, 2);
    if (+cod >= 1 && +cod <= 52) return cod;
  }
  const clave = (address.province || address.state || "").toLowerCase().trim();
  for (const [nom, cod] of Object.entries(PROVINCIAS_MAP)) {
    if (clave.includes(nom)) return cod;
  }
  return null;
}

/* ============ Descarga directa + proxies de respaldo ============ */
async function fetchConProxy(url) {
  const intentos = [
    () => fetch(url, { headers: { "Accept": "application/json" } }),
    () => fetch(url),
    async () => {
      const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      return new Response(data.contents);
    },
    () => fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`)
  ];

  for (const ejecutarFetch of intentos) {
    try {
      const resp = await ejecutarFetch();
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const texto = (await resp.text()).trim();
      if (!texto) throw new Error("Respuesta vacía");

      if (texto.startsWith("<")) {
        return xmlAEstaciones(texto);
      }
      return JSON.parse(texto);
    } catch (e) {
      console.warn("Intento de descarga falló:", e.message);
    }
  }
  throw new Error("No se pudo descargar la información de las gasolineras.");
}

function decodificarTag(tag) {
  return tag.replace(/_x([0-9A-Fa-f]{4})_/g,
    (_, h) => String.fromCharCode(parseInt(h, 16)));
}

function xmlAEstaciones(texto) {
  const doc = new DOMParser().parseFromString(texto, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("XML mal formado");
  const items = [...doc.querySelectorAll("EESSPrecio")];
  if (items.length === 0) throw new Error("El XML no contiene estaciones");
  return {
    Fecha: doc.querySelector("Fecha")?.textContent || "",
    ListaEESSPrecio: items.map(el => {
      const obj = {};
      for (const child of el.children) {
        obj[decodificarTag(child.tagName)] = child.textContent;
      }
      return obj;
    })
  };
}

/* ============ Carga de gasolineras por provincia ============ */
function diasHistoricoRequeridos() {
  const f = selAntiguedad.value;
  if (f === "MAX_X" || f === "MAS_X") {
    return Math.max(4, Math.min(10, (+inpDiasDrawer.value || 3) + 1));
  }
  return 4;
}

async function cargarProvincia(codProvincia, forzar = false) {
  if (!codProvincia) return;
  if (!forzar && provinciasCargadas.has(codProvincia)) return;

  const hoy = new Date().toISOString().slice(0, 10);
  const cacheKey = `gasolineras_prov_${codProvincia}`;
  const cache = JSON.parse(localStorage.getItem(cacheKey) || "null");

  if (!forzar && cache && cache.fecha === hoy && cache.datos?.[0]?.ideess !== undefined) {
    incorporarEstaciones(cache.datos);
    provinciasCargadas.add(codProvincia);
    calcularAntiguedadPrecios(codProvincia, diasHistoricoRequeridos());
    return;
  }

  estado(`Descargando datos de la provincia (${codProvincia})…`);
  try {
    const url = `${API_PROVINCIA}${codProvincia}`;
    const json = await fetchConProxy(url);
    const fechaMiteco = (json.Fecha || "").split(" ")[0] || formatearFechaMiteco(new Date());

    const nuevas = (json.ListaEESSPrecio || []).map(e => ({
      id: `${e["IDEESS"] || e["Rótulo"]}-${e["Latitud"]}-${e["Longitud (WGS84)"]}`,
      ideess: e["IDEESS"] || "",
      codProvincia,
      fechaMiteco,
      rotulo: e["Rótulo"] || "Sin nombre",
      direccion: [e["Dirección"], e["Localidad"], e["Provincia"]].filter(Boolean).join(", "),
      lat: numEs(e["Latitud"]),
      lon: numEs(e["Longitud (WGS84)"]),
      horario: e["Horario"] || "",
      precios: Object.fromEntries(Object.entries(FUELS).map(([k, f]) => [k, numEs(e[f.campo])]))
    })).filter(e => e.lat !== null && e.lon !== null);

    localStorage.setItem(cacheKey, JSON.stringify({ fecha: hoy, datos: nuevas }));
    incorporarEstaciones(nuevas);
    provinciasCargadas.add(codProvincia);
    calcularAntiguedadPrecios(codProvincia, diasHistoricoRequeridos());
  } catch (err) {
    estado("Error cargando provincia: " + err.message);
  }
}

function incorporarEstaciones(lista) {
  const ids = new Set(estaciones.map(e => e.id));
  for (const item of lista) {
    if (!ids.has(item.id)) {
      item.marca = normalizarMarca(item.rotulo);
      estaciones.push(item);
      ids.add(item.id);
    }
  }
  const marcasValidas = new Set(estaciones.map(e => e.marca));
  marcasSel = new Set([...marcasSel].map(normalizarMarca).filter(m => marcasValidas.has(m)));

  construirFiltroMarcas();
  actualizarUIDescuentos();
  pintar();
}

function construirFiltroMarcas() {
  const cont = document.getElementById("marcas");
  cont.innerHTML = "";

  const conteo = new Map();
  for (const e of estaciones) {
    conteo.set(e.marca, (conteo.get(e.marca) || 0) + 1);
  }
  const marcas = [...conteo.keys()].sort((a, b) => a.localeCompare(b, "es"));

  if (marcas.length === 0) {
    cont.innerHTML = `<em style="font-size:.8rem">Sin gasolineras</em>`;
    return;
  }
  const todas = document.createElement("label");
  todas.innerHTML = `<input type="checkbox" id="chkTodas" ${marcasSel.size === 0 ? "checked" : ""}> Todas (${marcas.length})`;
  cont.appendChild(todas);
  todas.querySelector("input").onchange = e => {
    marcasSel = e.target.checked ? new Set() : new Set(marcas);
    guardarPrefs(); construirFiltroMarcas(); pintar();
  };
  for (const m of marcas) {
    const lb = document.createElement("label");
    lb.innerHTML = `<input type="checkbox" ${marcasSel.has(m) ? "checked" : ""}> ${m} (${conteo.get(m)})`;
    lb.querySelector("input").onchange = ev => {
      ev.target.checked ? marcasSel.add(m) : marcasSel.delete(m);
      guardarPrefs(); pintar();
    };
    cont.appendChild(lb);
  }
}

/* ============ Pintar en el mapa y lista ============ */
function etiquetaResumenAntiguedad(filtro, diasX) {
  if (filtro === "TODAS") return "";
  if (filtro === "0") return " · act. hoy";
  if (filtro === "1") return " · ≤ 1d sin act.";
  if (filtro === "2") return " · ≤ 2d sin act.";
  if (filtro === "3") return " · ≤ 3d sin act.";
  if (filtro === "MAX_X") return ` · ≤ ${diasX}d sin act.`;
  if (filtro === "EXACTO_1") return " · 1d sin act.";
  if (filtro === "EXACTO_2") return " · 2d sin act.";
  if (filtro === "MAS_3") return " · > 3d sin act.";
  if (filtro === "MAS_X") return ` · > ${diasX}d sin act.`;
  return "";
}

function pintar() {
  guardarPrefs();
  capaEstaciones.clearLayers();
  const fuel = selCarb.value;
  const coche = obtenerCocheActivo();
  const ordenarPorCosteReal = !!(coche && document.getElementById("chkOrdenCosteReal").checked);
  const filtroAnt = selAntiguedad.value || "TODAS";
  const diasX = Math.max(1, +inpDiasDrawer.value || 3);
  const limiteRuta = document.getElementById("soloRuta").checked ? 0.15 : +document.getElementById("radio").value;
  const radioUbicacion = +document.getElementById("radioUbicacion").value;

  const filtradas = estaciones.filter(e =>
    (marcasSel.size === 0 || marcasSel.has(e.marca)) &&
    e.precios[fuel] != null &&
    cumpleFiltroAntiguedad(e, fuel, filtroAnt, diasX) &&
    (ruta ? distARutaKm([e.lat, e.lon], ruta) <= limiteRuta
          : (userPos ? distKm([e.lat, e.lon], userPos) <= radioUbicacion : false))
  );

  const desgloses = new Map();
  for (const e of filtradas) {
    desgloses.set(e.id, calcularDesgloseCoche(e, fuel, coche));
  }

  filtradas.sort((a, b) => {
    const da = desgloses.get(a.id);
    const db = desgloses.get(b.id);
    if (ordenarPorCosteReal && da.costeTotal != null && db.costeTotal != null) {
      return da.costeTotal - db.costeTotal;
    }
    return da.precioFinal - db.precioFinal;
  });

  const valorMetrica = e => {
    const d = desgloses.get(e.id);
    return (ordenarPorCosteReal && d.costeTotal != null) ? d.costeTotal : d.precioFinal;
  };

  const minVal = filtradas.length ? valorMetrica(filtradas[0]) : 0;
  const maxVal = filtradas.length ? valorMetrica(filtradas[filtradas.length - 1]) : 0;

  const marcadoresPorId = new Map();

  for (const e of filtradas) {
    const precioBase = e.precios[fuel];
    const d = desgloses.get(e.id);
    const precioFinal = d.precioFinal;
    const tieneDesc = precioFinal < precioBase;
    const color = colorPorValor(valorMetrica(e), minVal, maxVal);

    const distTexto = ruta
      ? `<br><small>🛣️ Desvío de ruta: ${d.distDesvioRuta.toFixed(1)} km (${d.distIdaVueltaKm.toFixed(1)} km i/v)</small>`
      : (d.distUbicacion !== null ? `<br><small>📍 A ${d.distUbicacion.toFixed(1)} km (${d.distIdaVueltaKm.toFixed(1)} km i/v)</small>` : "");

    let infoCochePopup = "";
    if (coche && d.costeTotal != null) {
      infoCochePopup =
        `<br><small style="color:#1565C0;font-weight:600">` +
        `🚗 <b>${coche.nombre}</b> (${coche.deposito}L):<br>` +
        `• Depósito: ${d.costeDeposito.toFixed(2)} €<br>` +
        `• Desplazamiento i/v (${d.distIdaVueltaKm.toFixed(1)} km · ${d.litrosViaje.toFixed(2)}L): +${d.costeViaje.toFixed(2)} €<br>` +
        `• <b>Total real: ${d.costeTotal.toFixed(2)} €</b>` +
        `</small>`;
    }

    const btnHist = e.ideess
      ? `<br><button class="sec" style="margin-top:6px;padding:4px 6px;font-size:.78rem" onclick="verEvolucion('${e.ideess}', '${e.codProvincia}', '${e.id}')">📈 Ver evolución (7 días)</button><div id="grafica-${e.ideess}"></div>`
      : "";

    const htmlPrecioPopup = tieneDesc
      ? `<span class="precio" style="color:${color}">${FUELS[fuel].label}: ${precioFinal.toFixed(3)} €/l</span>` +
        `<span class="precio-tachado">${precioBase.toFixed(3)} €/l</span>` +
        `<span class="badge-desc">${etiquetaDescuento(e.marca)}</span>`
      : `<span class="precio" style="color:${color}">${FUELS[fuel].label}: ${precioFinal.toFixed(3)} €/l</span>`;

    const marker = L.marker([e.lat, e.lon], { icon: crearIconoGasolinera(color) }).bindPopup(
      `<b>${e.rotulo}</b><br><small>${e.direccion}</small><br>` +
      htmlPrecioPopup +
      infoCochePopup +
      `<br><small>${textoAntiguedad(e, fuel)}</small>` +
      distTexto +
      (e.horario ? `<br><small>${e.horario}</small>` : "") +
      btnHist
    ).addTo(capaEstaciones);

    marcadoresPorId.set(e.id, marker);
  }

  const contLista = document.getElementById("listaBaratas");
  contLista.innerHTML = "";

  if (filtradas.length === 0) {
    contLista.innerHTML = `<em style="font-size:.8rem; color:#666">Ninguna gasolinera cumple el filtro.</em>`;
  } else {
    for (const [idx, e] of filtradas.slice(0, 20).entries()) {
      const precioBase = e.precios[fuel];
      const d = desgloses.get(e.id);
      const precioFinal = d.precioFinal;
      const tieneDesc = precioFinal < precioBase;
      const color = colorPorValor(valorMetrica(e), minVal, maxVal);

      const card = document.createElement("div");
      card.className = "item-gasolinera";

      const textoDistancia = ruta
        ? `🛣️ Desvío ${d.distDesvioRuta.toFixed(1)} km · `
        : (d.distUbicacion !== null ? `📍 ${d.distUbicacion.toFixed(1)} km · ` : "");

      let lineaCoche = "";
      let bloqueDerecho = `
        <div class="importe" style="color:${color}">${precioFinal.toFixed(3)} €/l</div>
        ${tieneDesc ? `<div class="precio-tachado" style="margin-left:0">${precioBase.toFixed(3)} €/l</div>` : ""}
      `;

      if (coche && d.costeTotal != null) {
        lineaCoche = `
          <div class="meta-coche">
            🚗 Depósito: ${d.costeDeposito.toFixed(2)} € + Viaje i/v: ${d.costeViaje.toFixed(2)} € = <b>${d.costeTotal.toFixed(2)} €</b>
          </div>
        `;
        if (ordenarPorCosteReal) {
          bloqueDerecho = `
            <div class="importe" style="color:${color}">${d.costeTotal.toFixed(2)} €</div>
            <div class="sub-importe">${precioFinal.toFixed(3)} €/l</div>
            ${tieneDesc ? `<div class="precio-tachado" style="margin-left:0">${precioBase.toFixed(3)} €/l</div>` : ""}
          `;
        } else {
          bloqueDerecho = `
            <div class="importe" style="color:${color}">${precioFinal.toFixed(3)} €/l</div>
            ${tieneDesc ? `<div class="precio-tachado" style="margin-left:0">${precioBase.toFixed(3)} €/l</div>` : ""}
            <div class="sub-importe">Total: ${d.costeTotal.toFixed(2)} €</div>
          `;
        }
      }

      card.innerHTML = `
        <div class="info">
          <div class="nombre">
            ${idx + 1}. ${e.rotulo}
            ${tieneDesc ? `<span class="badge-desc">${etiquetaDescuento(e.marca)}</span>` : ""}
          </div>
          <div class="meta">${textoDistancia}${e.direccion}</div>
          ${lineaCoche}
          <div class="meta">${textoAntiguedad(e, fuel)}</div>
        </div>
        <div style="text-align:right; flex-shrink:0">
          ${bloqueDerecho}
        </div>
      `;

      card.onclick = () => {
        mapa.setView([e.lat, e.lon], 15);
        const m = marcadoresPorId.get(e.id);
        if (m) m.openPopup();
      };
      contLista.appendChild(card);
    }
  }

  estado(
    `${filtradas.length} gasolineras · ${FUELS[fuel].label}` +
    (coche ? ` · ${coche.nombre}` : "") +
    etiquetaResumenAntiguedad(filtroAnt, diasX) +
    (calculandoAntiguedad ? " · ⏳ comprobando histórico…" : "") +
    (ordenarPorCosteReal ? " · orden: coste total" : " · orden: €/l") +
    (ruta ? " · en ruta" : ` · máx. ${radioUbicacion} km`)
  );
}

/* ============ Fijar Origen y Ubicación ============ */
async function fijarOrigenConCoords(lat, lon, zoom = 13, codProvincia = null) {
  userPos = [lat, lon];
  if (marcadorUsuario) mapa.removeLayer(marcadorUsuario);
  marcadorUsuario = L.marker([lat, lon], { icon: iconoUsuario, zIndexOffset: 1000 }).addTo(mapa)
    .bindPopup("<b>Tu ubicación / Origen</b>").openPopup();
  mapa.setView([lat, lon], zoom);

  if (!codProvincia) {
    estado("Determinando provincia…");
    try {
      const resp = await fetch(`${NOMINATIM_REVERSE}&lat=${lat}&lon=${lon}`);
      const data = await resp.json();
      codProvincia = extraerCodProvincia(data.address);
    } catch (_) {}
  }

  if (codProvincia) {
    await cargarProvincia(codProvincia);
  } else {
    estado("No se pudo determinar la provincia correspondiente.");
  }
  pintar();
}

function pedirGps() {
  estado("Obteniendo ubicación GPS…");
  navigator.geolocation.getCurrentPosition(
    pos => fijarOrigenConCoords(pos.coords.latitude, pos.coords.longitude),
    err => estado("Error GPS: " + err.message + ". Usa Preferencias para buscar dirección.")
  );
}

document.getElementById("btnGps").onclick = () => { pedirGps(); cerrarPreferencias(); };
document.getElementById("btnGpsRapido").onclick = pedirGps;

document.getElementById("btnDir").onclick = async () => {
  const q = document.getElementById("direccion").value.trim();
  if (!q) return;
  estado("Buscando dirección…");
  try {
    const r = await fetch(NOMINATIM_SEARCH + encodeURIComponent(q));
    const res = await r.json();
    if (res.length === 0) { estado("Dirección no encontrada"); return; }
    const cod = extraerCodProvincia(res[0].address);
    await fijarOrigenConCoords(+res[0].lat, +res[0].lon, 13, cod);
    cerrarPreferencias();
  } catch (e) { estado("Error: " + e.message); }
};

/* ============ Rutas ============ */
document.getElementById("btnRuta").onclick = async () => {
  const q = document.getElementById("destino").value.trim();
  if (!q) return;
  if (!userPos) { estado("Indica primero tu ubicación de origen"); return; }
  estado("Calculando ruta…");
  try {
    const r = await fetch(NOMINATIM_SEARCH + encodeURIComponent(q));
    const res = await r.json();
    if (res.length === 0) { estado("Destino no encontrado"); return; }
    
    const codDest = extraerCodProvincia(res[0].address);
    if (codDest && !provinciasCargadas.has(codDest)) {
      await cargarProvincia(codDest);
    }

    const dest = [+res[0].lat, +res[0].lon];
    const url = `${OSRM}${userPos[1]},${userPos[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson`;
    const rr = await fetch(url);
    const rjson = await rr.json();
    if (rjson.code !== "Ok") { estado("No se pudo calcular la ruta"); return; }

    ruta = rjson.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    capaRuta.clearLayers();
    L.polyline(ruta, { color: "#1565C0", weight: 6 }).addTo(capaRuta);
    mapa.fitBounds(L.latLngBounds(ruta));
    pintar();
    cerrarPreferencias();
  } catch (e) { estado("Error de ruta: " + e.message); }
};

document.getElementById("btnQuitarRuta").onclick = () => {
  ruta = null;
  capaRuta.clearLayers();
  pintar();
};

/* ============ Eventos de Preferencias y Sincronización de Antigüedad ============ */
async function asegurarHistoricoParaFiltro() {
  const req = diasHistoricoRequeridos();
  for (const cod of provinciasCargadas) {
    const calc = maxDiasCalculadosPorProv.get(cod) || 0;
    if (req > calc) {
      await calcularAntiguedadPrecios(cod, req);
    }
  }
}

selAntiguedad.onchange = () => {

inpDiasDrawer.onchange = () => {

  }

/* ============ Histórico, Antigüedad y Gráfica ============ */
function formatearFechaMiteco(date) {
  const d = String(date.getDate()).padStart(2, "0");
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const y = date.getFullYear();
  return `${d}-${m}-${y}`;
}

async function obtenerHistoricoDiaProvincia(codProvincia, fechaStr) {
  const cacheKey = `gas_hist_${codProvincia}_${fechaStr}`;
  const cacheado = localStorage.getItem(cacheKey);
  if (cacheado) return JSON.parse(cacheado);

  const url = `${API_HIST_PROVINCIA}${fechaStr}/${codProvincia}`;
  const json = await fetchConProxy(url);
  const mapaDia = {};

  for (const e of (json.ListaEESSPrecio || [])) {
    const id = e["IDEESS"];
    if (!id) continue;
    mapaDia[id] = Object.fromEntries(
      Object.entries(FUELS)
        .map(([k, f]) => [k, numEs(e[f.campo])])
        .filter(([, val]) => val !== null)
    );
  }

  try {
    localStorage.setItem(cacheKey, JSON.stringify(mapaDia));
  } catch (_) {
    Object.keys(localStorage)
      .filter(k => k.startsWith("gas_hist_"))
      .slice(0, 5)
      .forEach(k => localStorage.removeItem(k));
  }
  return mapaDia;
}

async function calcularAntiguedadPrecios(codProvincia, maxDias = 4) {
  const hoy = new Date();
  const listaIndices = Array.from({ length: maxDias }, (_, i) => i + 1);
  const diasAtras = listaIndices.map(d => {
    const fecha = new Date(hoy);
    fecha.setDate(hoy.getDate() - d);
    return { dias: d, fechaStr: formatearFechaMiteco(fecha) };
  });

  const infoEl = document.getElementById("infoEstadoAntiguedad");
  calculandoAntiguedad = true;
  if (infoEl) infoEl.textContent = `⏳ Comprobando histórico de precios (${maxDias} días)…`;
  pintar();

  try {
    const historicos = await Promise.all(
      diasAtras.map(d => obtenerHistoricoDiaProvincia(codProvincia, d.fechaStr).catch(() => null))
    );

    const fechaHoyStr = formatearFechaMiteco(hoy);

    for (const e of estaciones) {
      if (e.codProvincia !== codProvincia || !e.ideess) continue;
      e.antiguedad = {};

      for (const fuel of Object.keys(FUELS)) {
        const precioHoy = e.precios[fuel];
        if (precioHoy == null) continue;

        let diasSinCambios = 0;
        let fechaPrecio = e.fechaMiteco || fechaHoyStr;

        for (let i = 0; i < diasAtras.length; i++) {
          const histDia = historicos[i];
          if (!histDia) break;
          const precioPasado = histDia[e.ideess]?.[fuel];
          if (precioPasado != null && Math.abs(precioPasado - precioHoy) < 0.0005) {
            diasSinCambios = diasAtras[i].dias;
            fechaPrecio = diasAtras[i].fechaStr;
          } else {
            break;
          }
        }

        e.antiguedad[fuel] = { dias: diasSinCambios, fecha: fechaPrecio, maxComprobado: maxDias - 1 };
      }
    }
    maxDiasCalculadosPorProv.set(codProvincia, maxDias);
    if (infoEl) infoEl.textContent = `✅ Histórico comprobado (${maxDias} días hacia atrás).`;
  } catch (err) {
    console.warn("No se pudo calcular la antigüedad de precios:", err);
    if (infoEl) infoEl.textContent = `⚠️ No se pudo comprobar todo el histórico.`;
  } finally {
    calculandoAntiguedad = false;
    pintar();
  }
}

function textoAntiguedad(estacion, fuel) {
  const info = estacion.antiguedad?.[fuel];
  if (!info) {
    return estacion.fechaMiteco ? `📅 Boletín MITECO: ${estacion.fechaMiteco} (comprobando histórico…)` : "📅 Comprobando histórico…";
  }
  const tope = info.maxComprobado || 3;
  if (info.dias === 0) return `🟢 Actualizado hoy (${info.fecha})`;
  if (info.dias === 1) return `🕒 1 día sin actualizar (desde ${info.fecha})`;
  if (info.dias <= tope) return `🕒 ${info.dias} días sin actualizar (desde ${info.fecha})`;
  return `⚠️ +${tope} días sin actualizar (≤ ${info.fecha})`;
}

function cumpleFiltroAntiguedad(estacion, fuel, filtro, diasX = 3) {
  if (!filtro || filtro === "TODAS") return true;
  const info = estacion.antiguedad?.[fuel];
  if (!info) return true;

  if (filtro === "0") return info.dias === 0;
  if (filtro === "1") return info.dias <= 1;
  if (filtro === "2") return info.dias <= 2;
  if (filtro === "3") return info.dias <= 3;
  if (filtro === "MAX_X") return info.dias <= diasX;
  if (filtro === "EXACTO_1") return info.dias === 1;
  if (filtro === "EXACTO_2") return info.dias === 2;
  if (filtro === "MAS_3") return info.dias > 3;
  if (filtro === "MAS_X") return info.dias > diasX;
  return true;
}

async function verEvolucion(ideess, codProvincia, idEstacion) {
  const cont = document.getElementById(`grafica-${ideess}`);
  if (!cont) return;
  const fuel = selCarb.value;
  cont.innerHTML = `<small style="color:#666">Cargando histórico de 7 días…</small>`;

  try {
    const hoy = new Date();
    const fechas = [];
    for (let i = 6; i >= 1; i--) {
      const d = new Date(hoy);
      d.setDate(hoy.getDate() - i);
      fechas.push({
        etiqueta: `${d.getDate()}/${d.getMonth() + 1}`,
        fechaMiteco: formatearFechaMiteco(d)
      });
    }

    const resultados = await Promise.all(
      fechas.map(f => obtenerHistoricoDiaProvincia(codProvincia, f.fechaMiteco).catch(() => null))
    );

    const serie = fechas.map((f, idx) => ({
      idx,
      etiqueta: f.etiqueta,
      precio: resultados[idx]?.[ideess]?.[fuel] ?? null
    }));

    const estHoy = estaciones.find(e => e.id === idEstacion);
    serie.push({
      idx: 6,
      etiqueta: "Hoy",
      precio: estHoy?.precios?.[fuel] ?? null
    });

    const puntosReales = [];
    let ultimoPrecioConocido = null;

    for (let i = 0; i < serie.length; i++) {
      const item = serie[i];
      if (item.precio === null) continue;

      const esPrimero = ultimoPrecioConocido === null;
      const esHoy = i === serie.length - 1;
      const huboCambio = !esPrimero && Math.abs(item.precio - ultimoPrecioConocido) >= 0.0005;

      if (esPrimero || huboCambio || esHoy) {
        puntosReales.push(item);
        ultimoPrecioConocido = item.precio;
      }
    }

    if (puntosReales.length === 0) {
      cont.innerHTML = `<small style="color:#c62828">Sin datos históricos disponibles.</small>`;
      return;
    }

    cont.innerHTML = generarSvgGrafica(serie, puntosReales);
  } catch (e) {
    cont.innerHTML = `<small style="color:#c62828">Error al cargar histórico.</small>`;
  }
}

function generarSvgGrafica(serieCompleta, puntosReales) {
  const w = 240, h = 115, padX = 28, padY = 24;
  const precios = puntosReales.map(p => p.precio);
  let min = Math.min(...precios), max = Math.max(...precios);
  const sinCambios = Math.abs(max - min) < 0.0005;
  if (sinCambios) { min -= 0.02; max += 0.02; }

  const xPos = idx => padX + (idx / (serieCompleta.length - 1)) * (w - padX * 2);
  const yPos = precio => padY + (1 - (precio - min) / (max - min)) * (h - padY * 2);

  const coords = puntosReales.map(p => ({
    x: xPos(p.idx),
    y: yPos(p.precio),
    ...p
  }));

  const polilinea = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");

  return `
    <svg width="${w}" height="${h}" style="margin-top:6px;background:#f8f9fa;border:1px solid #ddd;border-radius:6px;display:block">
      ${coords.length > 1
        ? `<polyline fill="none" stroke="#1565C0" stroke-width="2" stroke-dasharray="${sinCambios ? "4,3" : "none"}" points="${polilinea}" />`
        : ""}
      ${coords.map(c => `
        <circle cx="${c.x}" cy="${c.y}" r="3.5" fill="#2E7D32" />
        <text x="${c.x}" y="${c.y - 7}" font-size="9" text-anchor="middle" fill="#222" font-weight="600">${c.precio.toFixed(3)}</text>
      `).join("")}
      ${serieCompleta.map(s => `
        <text x="${xPos(s.idx)}" y="${h - 6}" font-size="8" text-anchor="middle" fill="${s.precio !== null ? "#555" : "#bbb"}">${s.etiqueta}</text>
      `).join("")}
    </svg>
    ${sinCambios ? `<small style="color:#666;display:block;margin-top:2px;font-size:.72rem">Sin variaciones de precio en los días consultados.</small>` : ""}
  `;
}
