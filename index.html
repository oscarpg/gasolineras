<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gasolineras España</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!--
  Texts are in Spanish so the page reads correctly before the script runs.
  At start-up (and when the language changes) every element with a data-i18n*
  attribute is translated: data-i18n → text, data-i18n-placeholder, data-i18n-title,
  data-i18n-aria-label.
-->

    <!-- Floating top bar -->
    <header id="topbar">
      <div class="topbar-card">
        <button
          id="open-preferences"
          title="Abrir Preferencias"
          data-i18n-title="topbar.openPreferences"
          aria-label="Abrir Preferencias"
          data-i18n-aria-label="topbar.openPreferences"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="preferences-drawer"
        >
          <span class="icon-mobile" aria-hidden="true">☰</span>
          <span class="icon-desktop" data-i18n="topbar.preferences">⚙️ Preferencias</span>
        </button>
      </div>
      <div class="topbar-card">
        <button
          class="btn-secondary"
          id="quick-gps"
          title="Usar mi ubicación GPS"
          data-i18n-title="topbar.useGps"
          aria-label="Usar mi ubicación GPS"
          data-i18n-aria-label="topbar.useGps"
        >
          📍
        </button>
      </div>
    </header>

    <!-- Full-screen map -->
    <main id="map" role="region" aria-label="Mapa de gasolineras" data-i18n-aria-label="map.label"></main>

    <!-- Floating list of the cheapest stations -->
    <section id="results-panel" aria-labelledby="results-title">
      <div
        class="results-header"
        id="results-toggle"
        role="button"
        tabindex="0"
        aria-expanded="true"
        aria-controls="results-body"
      >
        <h2 id="results-title" class="results-title" data-i18n="results.title">⛽ Gasolineras más baratas</h2>
        <span id="results-toggle-icon" aria-hidden="true">▼</span>
      </div>
      <div id="results-body" class="results-body">
        <div class="results-options">
          <button type="button" id="favourites-chip" class="chip" aria-pressed="false" hidden></button>
          <span id="sort-label" class="results-options-label" data-i18n="results.sortLabel">Ordenar:</span>
          <div class="segmented" id="sort-options" role="radiogroup" aria-labelledby="sort-label">
            <button type="button" role="radio" data-sort="price" data-i18n="results.sortPrice">€/l</button>
            <button type="button" role="radio" data-sort="distance" data-i18n="results.sortDistance">
              Distancia
            </button>
            <button type="button" role="radio" data-sort="total" data-i18n="results.sortTotal">
              Coste total
            </button>
          </div>
        </div>
        <div id="status" role="status" aria-live="polite" data-i18n="results.waiting">
          Esperando ubicación…
        </div>
        <div id="offline-banner" class="offline-banner" role="status" hidden data-i18n="message.offline">
          Sin conexión: precios guardados
        </div>
        <div id="status-error" class="status-error" role="alert" hidden></div>
        <div id="results-list">
          <em class="u-text-sm u-text-muted" data-i18n="results.noData">Sin datos para mostrar…</em>
        </div>
      </div>
    </section>

    <!-- Preferences drawer and its backdrop -->
    <div id="preferences-backdrop"></div>
    <aside id="preferences-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" inert>
      <div class="drawer-header">
        <h2 id="drawer-title" data-i18n="drawer.title">⚙️ Preferencias y Filtros</h2>
        <button
          id="close-preferences"
          title="Cerrar"
          data-i18n-title="drawer.close"
          aria-label="Cerrar"
          data-i18n-aria-label="drawer.close"
        >
          ✕
        </button>
      </div>
      <div class="drawer-body">
        <!-- 1. Cars -->
        <fieldset>
          <legend data-i18n="cars.legend">🚗 Mis coches</legend>
          <label for="car-name" data-i18n="cars.name">Nombre del coche:</label>
          <input
            type="text"
            id="car-name"
            placeholder="Ej: SEAT León"
            data-i18n-placeholder="cars.namePlaceholder"
          />

          <div class="form-row">
            <div class="u-flex-1">
              <label for="car-fuel" data-i18n="cars.fuel">Combustible:</label>
              <select id="car-fuel"></select>
            </div>
          </div>

          <div class="form-row">
            <div class="u-flex-1">
              <label for="car-tank" data-i18n="cars.tank">Depósito (litros):</label>
              <input
                type="number"
                id="car-tank"
                placeholder="Ej: 50"
                data-i18n-placeholder="cars.tankPlaceholder"
                min="5"
                max="200"
                step="1"
              />
            </div>
            <div class="u-flex-1">
              <label for="car-consumption" data-i18n="cars.consumption">Consumo (l/100km):</label>
              <input
                type="number"
                id="car-consumption"
                placeholder="Ej: 6.2"
                data-i18n-placeholder="cars.consumptionPlaceholder"
                min="1"
                max="40"
                step="0.1"
              />
            </div>
          </div>
          <button class="btn-secondary" id="save-car" data-i18n="cars.save">Añadir / Guardar coche</button>
          <div id="car-list" class="item-list"></div>
        </fieldset>

        <!-- 2. Location and maximum distance -->
        <fieldset>
          <legend data-i18n="location.legend">📍 Ubicación y Distancia</legend>
          <button id="use-gps" class="u-mt-0" data-i18n="location.useGps">Usar mi ubicación GPS</button>
          <label for="address" data-i18n="location.orAddress">o buscar dirección:</label>
          <input
            type="text"
            id="address"
            placeholder="Calle, número, ciudad…"
            data-i18n-placeholder="location.addressPlaceholder"
          />
          <button class="btn-secondary" id="set-address" data-i18n="location.setAddress">
            Establecer dirección
          </button>

          <label for="search-radius" class="u-mt-10">
            <span data-i18n="location.maxDistance">Distancia máxima admitida:</span>
            <b><span id="search-radius-value">15</span> km</b>
          </label>
          <input type="range" id="search-radius" min="1" max="50" step="1" value="15" />
        </fieldset>

        <!-- 3. Route -->
        <fieldset>
          <legend data-i18n="route.legend">🛣️ Ruta</legend>
          <label for="destination" data-i18n="route.destination">Dirección de destino:</label>
          <input
            type="text"
            id="destination"
            placeholder="Ciudad o dirección de destino…"
            data-i18n-placeholder="route.destinationPlaceholder"
          />
          <button id="calculate-route" data-i18n="route.calculate">Calcular ruta</button>

          <label for="route-detour"
            ><span data-i18n="route.detour">Radio de desvío en ruta:</span>
            <b><span id="route-detour-value">3</span> km</b></label
          >
          <input type="range" id="route-detour" min="1" max="10" step="0.5" value="3" />

          <div class="form-row">
            <input type="checkbox" id="route-only" />
            <label for="route-only" class="u-m-0" data-i18n="route.only"
              >Solo gasolineras en la ruta (sin desvíos)</label
            >
          </div>

          <button class="btn-secondary" id="clear-route" data-i18n="route.clear">Quitar ruta</button>
        </fieldset>

        <!-- 4. Fuel, price age and brand filters -->
        <fieldset>
          <legend data-i18n="filters.legend">🔎 Filtros de gasolineras</legend>
          <label for="fuel" data-i18n="filters.fuel">Carburante a mostrar:</label>
          <select id="fuel"></select>

          <label for="age-filter" data-i18n="filters.age">Filtro por días sin actualizar el precio:</label>
          <select id="age-filter"></select>

          <div id="custom-days-row" class="form-row" hidden>
            <label for="custom-days" class="u-m-0 u-flex-1" data-i18n="filters.customDays"
              >Número de días (X):</label
            >
            <input type="number" id="custom-days" min="1" max="10" step="1" value="3" class="u-w-80px" />
          </div>
          <div id="history-status" class="form-hint" role="status" aria-live="polite"></div>

          <div id="brand-list-label" class="field-label u-mt-8" data-i18n="filters.brands">
            Marcas permitidas:
          </div>
          <div id="brand-list" role="group" aria-labelledby="brand-list-label">
            <em class="u-text-sm" data-i18n="filters.waiting">Esperando ubicación…</em>
          </div>
        </fieldset>

        <!-- 5. Brand discounts -->
        <fieldset>
          <legend data-i18n="discounts.legend">🏷️ Descuentos por marca</legend>
          <label for="discount-brand" data-i18n="discounts.brand">Marca:</label>
          <select id="discount-brand">
            <option value="" data-i18n="discounts.chooseBrand">Selecciona una marca…</option>
          </select>
          <div class="form-row">
            <input
              type="number"
              id="discount-value"
              placeholder="Ej: 5"
              data-i18n-placeholder="discounts.valuePlaceholder"
              min="0"
              step="0.5"
              class="u-w-45"
              aria-label="Valor del descuento"
              data-i18n-aria-label="discounts.value"
            />
            <select
              id="discount-type"
              class="u-w-55"
              aria-label="Tipo de descuento"
              data-i18n-aria-label="discounts.type"
            >
              <option value="CTS" data-i18n="discounts.typeCents">cts/litro (ej. 5 cts)</option>
              <option value="PCT" data-i18n="discounts.typePercent">% porcentaje (ej. 3%)</option>
            </select>
          </div>
          <button class="btn-secondary" id="add-discount" data-i18n="discounts.add">
            Añadir / Actualizar descuento
          </button>
          <div id="discount-list" class="item-list"></div>
        </fieldset>

        <!-- 6. Language -->
        <fieldset>
          <legend data-i18n="language.legend">🌐 Idioma</legend>
          <label for="language" data-i18n="language.label">Idioma de la aplicación:</label>
          <select id="language"></select>
        </fieldset>

        <button class="btn-secondary u-mb-14" id="refresh-prices" data-i18n="drawer.refresh">
          🔄 Forzar actualización de precios
        </button>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
