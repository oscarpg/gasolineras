name: Android release

# Publish a signed APK on a GitHub Release: push a tag like android-v1.0.0, or run this workflow
# from the Actions tab with a version (the tag android-v<version> is then created on that commit).
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0 (creates the tag android-v<version>)'
        required: true

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then version="$INPUT_VERSION"; else version="${GITHUB_REF_NAME#android-v}"; fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.3 (got '$version')"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
        working-directory: .

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace :core:test :data:test :state:test testReleaseUnitTest assembleRelease \
            -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"

      - name: Verify the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/gasolineras-$VERSION.apk"

      - name: Write the release notes
        # This version's CHANGELOG.md entry first, then the install notes. A release needs its entry.
        run: |
          entry="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[0-9.]+\]: / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(echo "$entry" | tr -d '[:space:]')" ]; then
            echo "::error::android/CHANGELOG.md has no entry for $VERSION (add a '## [$VERSION]' section)"
            exit 1
          fi
          { echo "## Novedades en $VERSION · What's new"; echo "$entry"; echo; echo "---"; echo; cat RELEASE_NOTES.md; } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Gasolineras Android ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: android/app/build/outputs/apk/release/gasolineras-${{ env.VERSION }}.apk

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
