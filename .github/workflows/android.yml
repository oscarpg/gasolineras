name: Android

on:
  push:
    paths: ['android/**', 'tests/fixtures/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'tests/fixtures/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Lint, unit tests & debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --stacktrace :core:test :data:test :state:test testDebugUnitTest lintDebug assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/gasolineras-test.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gasolineras-debug-apk
          path: android/app/build/outputs/apk/debug/gasolineras-test.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/core/build/reports/
            android/core/build/test-results/
            android/data/build/reports/
            android/data/build/test-results/
            android/state/build/reports/
            android/state/build/test-results/

  # One fixed download page for the latest test build:
  # https://github.com/<owner>/<repo>/releases/tag/android-test-build
  publish-test-build:
    name: Publish test build
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gasolineras-debug-apk
          path: apk
      - name: Move the test-build tag to this commit
        run: |
          git tag -f android-test-build
          git push -f origin refs/tags/android-test-build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-build
          name: Android test build
          prerelease: true
          make_latest: false
          body: |
            Latest debug build of the Android app (not for production).
            Branch `${{ github.ref_name }}`, commit ${{ github.sha }}.

            Install: download `gasolineras-test.apk` on the phone and open it,
            or from a PC run `adb install -r gasolineras-test.apk`.
          files: apk/gasolineras-test.apk

  emulator:
    name: Emulator tests (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest; status=$?; echo "::group::Diagnostics log"; adb logcat -d -s GasolinerasDiag:I; echo "::endgroup::"; exit $status
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reports-api-${{ matrix.api }}
          path: android/app/build/reports/androidTests/
