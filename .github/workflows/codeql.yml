name: CodeQL

# Advanced setup (replaces GitHub's default setup, which can't read Kotlin without a build:
# its "none" build mode only works for Java). Java/Kotlin is analysed while Gradle compiles
# the Android app; the other languages need no build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1' # weekly, Monday 04:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write # upload the results
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v4

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the Android app for CodeQL
        if: matrix.build-mode == 'manual'
        working-directory: android
        # CodeQL reads Kotlin while it is compiled, so every source file must really be
        # compiled in this process: no build or configuration cache, no Gradle or Kotlin daemon.
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process
          assembleDebug

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
